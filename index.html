<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foco Patagonia — Incendios Forestales</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --fire:#E8430A; --ember:#FF8C42; --smoke:#8B8B8B;
    --ash:#C8BEB2; --deep:#0D1B0A; --cream:#F5EFE6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--deep);color:var(--cream);font-family:'Source Sans 3',sans-serif;overflow:hidden;height:100vh;}

  /* HEADER */
  .header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:16px 28px;
    background:linear-gradient(180deg,rgba(13,27,10,.98) 0%,rgba(13,27,10,0) 100%);
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{display:flex;align-items:center;gap:14px;}
  .logo-icon{font-size:30px;animation:flicker 2.5s ease-in-out infinite;}
  @keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}
  .logo-text h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--ember);letter-spacing:1px;line-height:1.1;}
  .logo-text p{font-size:12px;color:var(--ash);letter-spacing:2px;text-transform:uppercase;font-weight:300;}
  .nav-filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-btn{
    padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:var(--ash);font-size:13px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;
    font-family:'Source Sans 3',sans-serif;font-weight:600;
  }
  .filter-btn:hover,.filter-btn.active{background:var(--fire);border-color:var(--fire);color:#fff;}

  /* MAP CONTAINER */
  .map-wrapper{
    width:100vw;height:100vh;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 38% 52%,#152510 0%,#0d1b0a 45%,#060e06 100%);
  }

  /* El SVG ahora se adapta dinámicamente y tiene transition para el zoom con botones */
  #map-svg-container{
    position:absolute;
    top:0;left:0;
    cursor:grab;
    user-select:none;
    transform-origin: center center;
    transition: transform 0.05s linear; /* Suaviza el zoom sutilmente */
  }
  #map-svg-container:active{cursor:grabbing;}

  #main-svg {
    height: 82vh; 
    width: auto;
    max-height: 1100px; 
    display: block;
  }

  /* ZOOM CONTROLS */
  .zoom-controls {
    position: fixed; right: 28px; bottom: 90px; z-index: 100;
    display: flex; flex-direction: column; gap: 10px;
  }
  .zoom-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(13,27,10,.88); border: 1px solid rgba(232,67,10,.3);
    color: var(--ember); font-size: 24px; cursor: pointer; backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; transition: all .2s;
    font-family: 'Source Sans 3', sans-serif;
  }
  .zoom-btn:hover { background: var(--fire); color: #fff; box-shadow: 0 0 12px rgba(232,67,10,.4); }

  /* PULSE ANIMATION */
  .pulse-ring{
    animation:pulse-anim 2s ease-out infinite;
    transform-origin:center;
    transform-box:fill-box;
  }
  @keyframes pulse-anim{
    0%{opacity:.5;transform:scale(.7);}
    100%{opacity:0;transform:scale(2.2);}
  }
  .marker-dot{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:center;}
  .marker-dot:hover{transform:scale(1.3);}

  /* TIMELINE */
  .timeline{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    z-index:100;display:flex;align-items:center;gap:4px;
    background:rgba(13,27,10,.93);border:1px solid rgba(232,67,10,.22);
    border-radius:40px;padding:8px 20px;backdrop-filter:blur(12px);
  }
  .timeline-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--smoke);margin-right:16px;white-space:nowrap;font-weight:600;}
  .year-btn{
    padding:6px 14px;border-radius:20px;border:none;background:transparent;
    color:var(--ash);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;
    font-family:'Source Sans 3',sans-serif;
  }
  .year-btn:hover{color:var(--ember);}
  .year-btn.active{background:var(--fire);color:#fff;box-shadow:0 0 10px rgba(232,67,10,.4);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,13,5,.88);
    z-index:200;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:linear-gradient(145deg,#121f10,#0d1b0a);
    border:1px solid rgba(232,67,10,.28);border-radius:16px;
    width:100%;max-width:580px;max-height:88vh;overflow-y:auto;
    position:relative;animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .modal-header{padding:26px 26px 0;position:relative;}
  .modal-year{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--ember);margin-bottom:7px;font-weight:600;}
  .modal-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--cream);line-height:1.2;margin-bottom:5px;}
  .modal-province{font-size:14px;color:var(--ash);letter-spacing:1px;}
  .modal-close{
    position:absolute;top:18px;right:18px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:var(--ash);width:34px;height:34px;border-radius:50%;
    cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;
  }
  .modal-close:hover{background:var(--fire);border-color:var(--fire);color:#fff;}
  .modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.06);margin:18px 0 0;}
  .stat{background:rgba(13,27,10,.9);padding:16px;text-align:center;}
  .stat-number{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ember);display:block;}
  .stat-label{font-size:11px;color:var(--smoke);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
  .modal-body{padding:24px 28px 28px;}
  .modal-section{margin-bottom:20px;}
  .modal-section-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ember);margin-bottom:10px;font-weight:600;}
  .modal-text{font-size:15px;line-height:1.75;color:var(--ash);font-weight:300;}
  .testimony{
    background:rgba(232,67,10,.07);border-left:3px solid var(--fire);
    padding:16px 18px;border-radius:0 8px 8px 0;
    font-style:italic;font-size:14px;color:var(--cream);line-height:1.6;margin-top:10px;
  }
  .testimony cite{display:block;font-style:normal;font-size:12px;color:var(--ember);margin-top:8px;letter-spacing:.5px;font-weight:600;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .tag{padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);font-size:11px;letter-spacing:.5px;color:var(--smoke);}

  /* LEGEND */
  .legend{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
  .legend-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--smoke);letter-spacing:.5px;}
  .legend-dot{width:14px;height:14px;border-radius:50%;background:var(--fire);box-shadow:0 0 6px var(--fire);flex-shrink:0;}
  .legend-dot.medium{width:11px;height:11px;}
  .legend-dot.small{width:8px;height:8px;background:var(--ember);box-shadow:0 0 4px var(--ember);}

  /* COUNTER */
  .counter{
    position:fixed;left:28px;bottom:90px;z-index:100;
    background:rgba(13,27,10,.88);border:1px solid rgba(232,67,10,.18);
    border-radius:14px;padding:16px 20px;backdrop-filter:blur(8px);
  }
  .counter-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--smoke);margin-bottom:8px;}
  .counter-number{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--fire);line-height:1;}
  .counter-sub{font-size:11px;color:var(--ash);margin-top:4px;max-width:200px;line-height:1.4;}

  /* SOURCE BADGE */
  .source-badge{
    position:fixed;left:28px;top:90px;z-index:100;
    background:rgba(13,27,10,.85);border:1px solid rgba(232,67,10,.15);
    border-radius:12px;padding:12px 16px;backdrop-filter:blur(8px);max-width:240px;
  }
  .source-badge strong{color:var(--ash);display:block;margin-bottom:4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .source-badge p{font-size:11px;color:var(--smoke);line-height:1.5;}

  /* TOOLTIP */
  .tooltip{
    position:fixed;background:rgba(13,27,10,.96);border:1px solid rgba(232,67,10,.32);
    border-radius:8px;padding:10px 14px;font-size:14px;color:var(--cream);
    pointer-events:none;z-index:150;display:none;backdrop-filter:blur(8px);max-width:260px;
  }
  .tooltip.show{display:block;}
  .tooltip strong{color:var(--ember);font-size:15px;display:block;margin-bottom:4px;}

  /* SMOKE */
  .smoke-particle{position:absolute;border-radius:50%;background:rgba(139,139,139,.04);animation:drift linear infinite;pointer-events:none;}
  @keyframes drift{0%{transform:translateY(0) translateX(0) scale(1);opacity:0}20%{opacity:.6}100%{transform:translateY(-200px) translateX(30px) scale(2.5);opacity:0}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">🔥</div>
    <div class="logo-text">
      <h1>Foco Patagonia</h1>
      <p>Incendios Forestales · Patagonia Argentina · 2015–2026</p>
    </div>
  </div>
  <div class="nav-filters">
    <button class="filter-btn active" data-val="todos" onclick="toggleFilter('prov', 'todos', this)">Todos</button>

    <button class="filter-btn" data-val="rionegro" onclick="toggleFilter('prov', 'rionegro', this)">Río Negro</button>

        <!-- TIERRA DEL FUEGO -->

      </g>

      <text x="320" y="275" text-anchor="middle" font-size="20" fill="#4a8028" font-family="'Source Sans 3',sans-serif" letter-spacing="2.5" font-weight="700" opacity=".88">RÍO NEGRO</text>
      <text x="280" y="470" text-anchor="middle" font-size="21" fill="#408025" font-family="'Source Sans 3',sans-serif" letter-spacing="3" font-weight="700" opacity=".88">CHUBUT</text>

      <text x="491" y="347" font-size="12" fill="#2e5018" font-family="sans-serif" opacity=".38">42°S</text>

    </svg>

<!-- LEYENDA -->

function proj(lat, lon) {
  const x = (lon - (-74)) / ((-63) - (-74)) * (620 - 60) + 60;
  const y = (lat - (-36.5)) / ((-55) - (-36.5)) * (1060 - 40) + 40;
  return { x: Math.round(x), y: Math.round(y) };
}

// FILTROS SIMULTÁNEOS
// ═══════════════════════════════════════════════════════════════
let activeYears = new Set(['todos']);
let activeFilters = new Set(['todos']);

const SIZES = { large:20, medium:14, small:9 };

function toggleFilter(type, val, btn) {
  const activeSet = type === 'year' ? activeYears : activeFilters;
  
  if (val === 'todos') {
    activeSet.clear();
    activeSet.add('todos');
  } else {
    activeSet.delete('todos');
    if (activeSet.has(val)) {
      activeSet.delete(val);
    } else {
      activeSet.add(val);
    }
    if (activeSet.size === 0) activeSet.add('todos');
  }

  const selector = type === 'year' ? '.year-btn' : '.filter-btn';
  document.querySelectorAll(selector).forEach(b => {
    if (activeSet.has(b.getAttribute('data-val'))) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });

  renderMarkers();
}

// ═══════════════════════════════════════════════════════════════
// RENDERIZADO DE MARCADORES (Con Letra Más Grande)
// ═══════════════════════════════════════════════════════════════
function renderMarkers() {
  const g = document.getElementById('markers-group');
  g.innerHTML = '';

  const filtered = fires.filter(f => {
    const matchYear = activeYears.has('todos') || activeYears.has(f.year);
    
    let matchCat = activeFilters.has('todos');
    if (!matchCat) {
      matchCat = activeFilters.has(f.category);
      if (activeFilters.has('comunidades') && 
          f.tags.some(t => t.toLowerCase().includes('mapuche') || 
                           t.toLowerCase().includes('comunidad') || 
                           t.toLowerCase().includes('lof'))) {
        matchCat = true;
      }
    }

    return matchYear && matchCat;
  });

  filtered.forEach(fire => {
    const {x, y} = proj(fire.lat, fire.lon);
    const r  = SIZES[fire.size] || 12;
    const rp = r * 1.8;

    const ns = 'http://www.w3.org/2000/svg';

    const grp = document.createElementNS(ns, 'g');
    grp.setAttribute('class', 'marker-dot');
    grp.style.cursor = 'pointer';

    const ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('cx', x); ring.setAttribute('cy', y);
    ring.setAttribute('r', rp);
    ring.setAttribute('fill', 'rgba(232,67,10,0.18)');
    ring.setAttribute('class', 'pulse-ring');
    ring.style.animationDelay = (Math.random() * 1.5) + 's';
    grp.appendChild(ring);

    const glow = document.createElementNS(ns, 'circle');
    glow.setAttribute('cx', x); glow.setAttribute('cy', y);
    glow.setAttribute('r', r + 6);
    glow.setAttribute('fill', 'rgba(232,67,10,0.12)');
    grp.appendChild(glow);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    dot.setAttribute('r', r);
    const grad = fire.size === 'large' ? '#FF8C42' :
                 fire.size === 'medium'? '#E8430A' : '#cc6600';
    dot.setAttribute('fill', grad);
    dot.setAttribute('filter', 'url(#provglow)');
    grp.appendChild(dot);

    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('x', x);
    lbl.setAttribute('y', y - r - 7);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '12'); // Letra aumentada de 9 a 12
    lbl.setAttribute('font-weight', '600');
    lbl.setAttribute('fill', '#FF8C42');
    lbl.setAttribute('font-family', "'Source Sans 3', sans-serif");
    lbl.textContent = fire.name.split('\n')[0];
    lbl.style.pointerEvents = 'none';
    lbl.style.textShadow = '0 1px 3px rgba(0,0,0,0.9)';
    grp.appendChild(lbl);

    grp.addEventListener('mouseenter', (e) => showTooltip(e, fire));
    grp.addEventListener('mouseleave', hideTooltip);
    grp.addEventListener('click', () => openModal(fire));

    g.appendChild(grp);
  });

  const total = filtered.reduce((s, f) => {
    const n = parseInt(f.hectareas.replace(/\./g,'').replace(',','').replace('+',''));
    return s + (isNaN(n) ? 0 : n);
  }, 0);
  document.getElementById('counter-num').textContent = total.toLocaleString('es-AR') + (total > 0 ? '+' : '');
  
  let subText = 'Patagonia · ';
  if (activeYears.has('todos')) subText += 'Histórico 2015-2026';
  else subText += 'Años: ' + Array.from(activeYears).join(', ');
  document.getElementById('counter-sub').textContent = subText;
}

// TOOLTIP Y MODAL
// ═══════════════════════════════════════════════════════════════
function showTooltip(e, fire) {
  document.getElementById('tooltip-title').textContent = fire.name.split('\n')[0];
  document.getElementById('tooltip-sub').textContent   =
    `${fire.province} · ${fire.year} · ${fire.hectareas} ha`;
  document.getElementById('tooltip').classList.add('show');
}
document.addEventListener('mousemove', e => {
  const t = document.getElementById('tooltip');
  if (t.classList.contains('show')) {
    t.style.left = (e.clientX + 14) + 'px';
    t.style.top  = (e.clientY - 44) + 'px';

});
function hideTooltip() { document.getElementById('tooltip').classList.remove('show'); }

function openModal(fire) {
  hideTooltip();
  document.getElementById('modal-year').textContent     = `📅 ${fire.year}`;
  document.getElementById('modal-title').textContent    = fire.name.replace('\n', ' — ');

  document.getElementById('modal-stats').innerHTML = fire.stats.map(s =>
    `<div class="stat"><span class="stat-number">${s.num}</span><span class="stat-label">${s.label}</span></div>`
  ).join('');

  const fuenteHTML = fire.fuente_url
    ? `<div class="source-box"><p>📚 <strong>Fuente:</strong> ${fire.fuente}</p><a href="${fire.fuente_url}" target="_blank">→ Ver fuente original</a></div>`
    : `<div class="source-box"><p>📚 ${fire.fuente}</p></div>`;

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">🌳 Ecosistema afectado</div>
      <p class="modal-text">${fire.ecosistema}</p>
    </div>
    <div class="modal-section">

      <p class="modal-text">${fire.descripcion}</p>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">⚡ Causas</div>
      <p class="modal-text">${fire.causas}</p>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">💬 Fuente directa</div>
      <div class="testimony">"${fire.testimony}"<cite>${fire.testAuthor}</cite></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">🏷️ Temáticas</div>
      <div class="tags">${fire.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
    ${fuenteHTML}`;

  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }

// ═══════════════════════════════════════════════════════════════
// ZOOM, PAN Y DRAG (Control interactivo del SVG)
// ═══════════════════════════════════════════════════════════════
const container = document.getElementById('map-svg-container');
const svgEl = document.getElementById('main-svg');
let dragging = false, startX = 0, startY = 0, offsetX = 0, offsetY = 0;
let currentScale = 1;

function updateTransform() {
  container.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${currentScale})`;
}

// Botones de Zoom interactivos
window.zoomMap = function(factor) {
  currentScale *= factor;
  currentScale = Math.max(0.4, Math.min(currentScale, 4)); // Limita el nivel de acercamiento/alejamiento
  updateTransform();
};

function centerMap() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const rect = svgEl.getBoundingClientRect();
  
  offsetX = (vw - rect.width / currentScale) / 2;
  offsetY = (vh - rect.height / currentScale) / 2 + 35; 
  updateTransform();
}

// Zoom con la Ruedita del Mouse (o Touchpad)
document.getElementById('map-wrapper').addEventListener('wheel', e => {
  e.preventDefault();
  const zoomSensitivity = 0.0015;
  const delta = e.deltaY * -zoomSensitivity;
  let newScale = currentScale * (1 + delta);
  newScale = Math.max(0.4, Math.min(newScale, 4));
  currentScale = newScale;
  updateTransform();
}, { passive: false });

centerMap();
window.addEventListener('resize', centerMap);

container.addEventListener('mousedown', e => {
  dragging = true;
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  container.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  updateTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  container.style.cursor = 'grab';
});
container.addEventListener('touchstart', e => {
  if(e.touches.length === 1) {
    dragging = true; 
    startX = e.touches[0].clientX - offsetX; 
    startY = e.touches[0].clientY - offsetY;
  }
});
window.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  offsetX = e.touches[0].clientX - startX; 
  offsetY = e.touches[0].clientY - startY;
  updateTransform();
});
window.addEventListener('touchend', () => { dragging = false; });

// ═══════════════════════════════════════════════════════════════
// SMOKE PARTICLES
// ═══════════════════════════════════════════════════════════════
function createSmoke() {
  const wrapper = document.getElementById('map-wrapper');
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'smoke-particle';
    const sz = 60 + Math.random()*120;
    s.style.cssText = `
      width:${sz}px;height:${sz}px;
      left:${20+Math.random()*60}%;
      bottom:${20+Math.random()*30}%;
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*-10}s;
      pointer-events:none;position:absolute;
    `;
    wrapper.appendChild(s);
  }
}

createSmoke();
renderMarkers();
</script>
